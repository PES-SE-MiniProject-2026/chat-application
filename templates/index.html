<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Real-Time Chat</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>

  <body>
    <div class="chat-app">
      <!-- App Header -->
      <header class="chat-header">
        <div class="brand-section">
          <div class="brand-icon" aria-hidden="true">&#128172;</div>
          <div>
            <h1 class="brand-title">Real-Time Chat</h1>
            <p class="brand-subtitle">Software Engineering Mini-Project</p>
          </div>
        </div>

        <div class="user-nav-section">
          <div class="user-badge" id="user-badge" title="Active Session">
            <span class="status-dot connecting" id="connection-dot" aria-hidden="true"></span>
            <span>Logged in as <strong>{{ username }}</strong></span>
          </div>

          <form method="POST" action="{{ url_for('logout') }}">
            <button type="submit" class="btn btn-danger-outline" aria-label="Log out of application">
              Logout
            </button>
          </form>
        </div>
      </header>

      <!-- Main Chat Card -->
      <main class="chat-main-card">
        <!-- Recipient Bar -->
        <div class="recipient-toolbar">
          <div class="recipient-field-group">
            <label for="recipient">Chat with:</label>
            <div class="recipient-input-wrapper">
              <input
                id="recipient"
                name="recipient"
                maxlength="30"
                required
                placeholder="Enter recipient username..."
                autocomplete="off"
              />
            </div>
            <span id="recipient-unread-badge" class="unread-badge hidden" title="Unread messages" aria-live="polite"></span>
          </div>

          <!-- Recipient Presence Status (CHAT-F-030) -->
          <div id="recipient-presence" class="recipient-presence hidden" aria-live="polite">
            <span class="presence-dot offline" id="recipient-presence-dot" aria-hidden="true"></span>
            <span class="presence-text" id="recipient-presence-text">Offline</span>
          </div>
        </div>

        <!-- Group Chat Controls -->
        <div class="group-chat-controls">
            <h3>Group Chats</h3>

            <div class="group-create-form">
                <input
                    type="text"
                    id="group-name"
                    placeholder="Enter group name"
                    maxlength="50"
                />

                <input
                    type="text"
                    id="group-members"
                    placeholder="Member usernames (comma separated)"
                />

                <button type="button" id="create-group-button">
                    Create Group
                </button>
            </div>

            <div class="group-list-section">
                <label for="group-list">Your Groups:</label>
                <select id="group-list">
                    <option value="">Select a group</option>
                </select>
            </div>
            <div id="selected-group-info" style="display: none;">
                <h3 id="selected-group-name"></h3>
                <p id="selected-group-admin"></p>
            </div>
            <!-- Group Member Management -->
            <div class="group-management-controls">
                <input
                    type="text"
                    id="group-member-username"
                    placeholder="Enter username"
                />

                <button type="button" id="add-group-member">
                    Add Member
                </button>

                <button type="button" id="remove-group-member">
                    Remove Member
                </button>

                <button type="button" id="leave-group">
                    Leave Group
                </button>
            </div>
        </div>

        <!-- Missed-Messages Banner (CHAT-F-031) -->
        <div id="missed-messages-banner" class="missed-banner hidden" role="region" aria-label="Missed messages notification">
          <div class="missed-banner-inner">
            <span class="missed-banner-icon" aria-hidden="true">&#9888;</span>
            <span id="missed-messages-text" class="missed-banner-text"></span>
          </div>
          <button type="button" class="missed-banner-close" id="missed-banner-dismiss" aria-label="Dismiss missed messages notification">&times;</button>
        </div>

        <!-- Feedback & Status Bar -->
        <div class="chat-feedback-bar" role="region" aria-label="Chat status notices">
          <p id="notice" role="status" aria-live="polite"></p>
          <p id="typing-indicator" aria-live="polite"></p>
        </div>

        <!-- Scrollable Messages Area -->
        <div class="messages-container" id="messages-container" role="region" aria-label="Message history">
          <div id="messages-empty" class="empty-state">
            <div class="empty-state-icon" aria-hidden="true">&#128172;</div>
            <p class="empty-state-title">No messages yet</p>
            <p class="empty-state-text">Enter a recipient username above and send a message to start conversing in real time.</p>
          </div>

          <ul id="messages" role="log" aria-live="polite"></ul>
        </div>

        <!-- Composer Area -->
        <footer class="chat-composer">
          <!-- Selected-File Preview (CHAT-F-040) -->
          <div id="file-preview-bar" class="file-preview-bar hidden" role="region" aria-label="Selected file preview">
            <div class="file-preview-info">
              <span class="file-preview-icon" id="file-preview-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
              </span>
              <span class="file-preview-name" id="file-preview-name"></span>
              <span class="file-preview-size" id="file-preview-size"></span>
            </div>
            <button
              type="button"
              class="file-preview-remove"
              id="file-remove-button"
              aria-label="Remove selected attachment"
              title="Remove attachment"
            >
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <form id="message-form" autocomplete="off">
            <button
              type="button"
              class="composer-attach-btn"
              id="attach-button"
              aria-label="Attach file"
              title="Attach file (PNG, JPG, GIF, WebP, PDF, TXT)"
            >
              <svg
                class="attach-icon-svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
              </svg>
            </button>
            <input
              type="file"
              id="file-input"
              name="file"
              class="sr-only"
              accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt"
              tabindex="-1"
            />
            <label for="message-input" class="sr-only">Type a message</label>
            <input
              id="message-input"
              name="message-text"
              placeholder="Type a message..."
              maxlength="1000"
              required
              autocomplete="off"
            />
            <button type="submit" class="btn btn-primary" id="send-button">
              Send
            </button>
          </form>
        </footer>
      </main>
    </div>

    <script>
      // CHAT-SR-003: the auth callback runs on every connect and
      // reconnect, so a fresh short-lived token is always sent in the
      // WebSocket handshake. If no token can be obtained, an empty auth
      // object is sent and the server refuses the connection.
      const socket = io({
        secure: true,
        reconnectionAttempts: 5,
        auth: async (cb) => {
          try {
            const res = await fetch("/ws-token", {
              credentials: "same-origin",
              cache: "no-store"
            });

            if (!res.ok) {
              throw new Error("unauthorized");
            }

            const data = await res.json();
            cb({ token: data.token });
          } catch (err) {
            cb({});
          }
        }
      });

      const form = document.getElementById("message-form");
      const input = document.getElementById("message-input");
      const sendButton = document.getElementById("send-button");
      const attachButton = document.getElementById("attach-button");
      const fileInput = document.getElementById("file-input");
      const filePreviewBar = document.getElementById("file-preview-bar");
      const filePreviewName = document.getElementById("file-preview-name");
      const filePreviewSize = document.getElementById("file-preview-size");
      const fileRemoveButton = document.getElementById("file-remove-button");
      const recipient = document.getElementById("recipient");
      // Group chat elements
      const groupNameInput = document.getElementById("group-name");
      const groupMembersInput = document.getElementById("group-members");
      const createGroupButton = document.getElementById("create-group-button");
      const groupList = document.getElementById("group-list");
      // Group management elements
      const groupMemberUsername = document.getElementById("group-member-username");
      const addGroupMemberButton = document.getElementById("add-group-member");
      const removeGroupMemberButton = document.getElementById("remove-group-member");
      const leaveGroupButton = document.getElementById("leave-group");
      const selectedGroupInfo = document.getElementById("selected-group-info");
      const selectedGroupName = document.getElementById("selected-group-name");
      const selectedGroupAdmin = document.getElementById("selected-group-admin");

      // Currently selected group
      let selectedGroupId = null;

      // Store group details for admin permission checks
      let groupDetails = new Map();

      const recipientPresence = document.getElementById("recipient-presence");
      const recipientPresenceDot = document.getElementById("recipient-presence-dot");
      const recipientPresenceText = document.getElementById("recipient-presence-text");
      const unreadBadge = document.getElementById("recipient-unread-badge");
      const missedBanner = document.getElementById("missed-messages-banner");
      const missedText = document.getElementById("missed-messages-text");
      const missedBannerDismiss = document.getElementById("missed-banner-dismiss");
      const messages = document.getElementById("messages");
      const messagesContainer = document.getElementById("messages-container");
      const emptyState = document.getElementById("messages-empty");
      const notice = document.getElementById("notice");
      const typingIndicator = document.getElementById("typing-indicator");
      const connectionDot = document.getElementById("connection-dot");

      const currentUsername = {{ username | tojson }};
      const loginUrl = {{ url_for('login') | tojson }};

      // Outgoing message ID -> status element.
      const ownMessages = new Map();

      // Status events received before their message is rendered.
      const pendingStatuses = new Map();

      // Prevent duplicate rendering.
      const renderedMessages = new Set();

      // Incoming message IDs that have been rendered but not yet
      // reported as read (because the chat window wasn't being viewed).
      const unreadIncoming = new Set();

      // Unread counts cache by lower-case sender username (CHAT-F-032).
      let latestUnreadCounts = {};

      // Track currently displayed presence username (CHAT-F-030).
      let activePresenceUsername = null;
      let presenceDebounce = null;
      let typingTimer;

      // The chat counts as "viewed" only when this tab is visible
      // AND the browser window has focus.
      function isChatViewed() {
        return document.visibilityState === "visible" &&
               document.hasFocus();
      }

      // Send read receipts for all pending incoming messages,
      // but only if the user is actually looking at the chat.
      function flushReadReceipts() {
        if (!isChatViewed() || unreadIncoming.size === 0) {
          return;
        }

        for (const id of unreadIncoming) {
          socket.emit("message read", { message_id: Number(id) });
        }

        unreadIncoming.clear();
      }

      document.addEventListener("visibilitychange", flushReadReceipts);
      window.addEventListener("focus", flushReadReceipts);

      // Presence and last-seen formatting (CHAT-F-030)
      function formatLastSeen(isoString) {
        if (!isoString) return "Offline";
        const date = new Date(isoString);
        if (isNaN(date.getTime())) return "Offline";
        const diffSec = Math.floor((Date.now() - date.getTime()) / 1000);
        if (diffSec < 60) return "Offline · Last seen just now";
        const diffMin = Math.floor(diffSec / 60);
        if (diffMin < 60) return `Offline · Last seen ${diffMin}m ago`;
        const diffHours = Math.floor(diffMin / 60);
        if (diffHours < 24) return `Offline · Last seen ${diffHours}h ago`;
        const diffDays = Math.floor(diffHours / 24);
        return `Offline · Last seen ${diffDays}d ago`;
      }

      function clearPresenceIndicator() {
        activePresenceUsername = null;
        recipientPresence.classList.add("hidden");
        recipientPresenceText.textContent = "";
        recipientPresenceDot.className = "presence-dot offline";
      }

      function updateRecipientPresence(data) {
        if (!data || !data.username) return;
        const currentTarget = recipient.value.trim();
        if (!currentTarget || currentTarget.toLowerCase() !== data.username.toLowerCase()) {
          return;
        }
        if (data.username.toLowerCase() === currentUsername.toLowerCase()) {
          clearPresenceIndicator();
          return;
        }

        activePresenceUsername = data.username.toLowerCase();
        recipientPresence.classList.remove("hidden");

        if (data.is_online) {
          recipientPresenceDot.className = "presence-dot online";
          recipientPresenceText.textContent = "Online";
        } else {
          recipientPresenceDot.className = "presence-dot offline";
          recipientPresenceText.textContent = formatLastSeen(data.last_seen);
        }
      }

      function requestPresence(target) {
        const trimmed = (target || "").trim();
        if (!trimmed || trimmed.toLowerCase() === currentUsername.toLowerCase()) {
          clearPresenceIndicator();
          return;
        }
        socket.emit("get presence", { username: trimmed });
      }

      function loadChatHistory(username) {
        const target = (username || "").trim();

        if (!target || target.toLowerCase() === currentUsername.toLowerCase()) {
            return;
        }

        renderedMessages.clear();
        unreadIncoming.clear();
        pendingStatuses.clear();
        ownMessages.clear();

        messages.innerHTML = "";

        if (emptyState) {
            emptyState.style.display = "block";
            emptyState.textContent = "Loading chat history...";
        }

        socket.emit("load chat history", {
            recipient: target
        });
    }

      // Unread count badge update (CHAT-F-032)
      function updateUnreadBadge() {
        const target = recipient.value.trim().toLowerCase();
        if (!target || target === currentUsername.toLowerCase()) {
          unreadBadge.classList.add("hidden");
          unreadBadge.textContent = "";
          return;
        }

        const count = latestUnreadCounts[target] || 0;
        if (count > 0) {
          unreadBadge.textContent = `${count} unread`;
          unreadBadge.setAttribute("aria-label", `${count} unread messages from ${recipient.value.trim()}`);
          unreadBadge.classList.remove("hidden");
        } else {
          unreadBadge.classList.add("hidden");
          unreadBadge.textContent = "";
        }
      }

      // Attachment helpers & controls (CHAT-F-040, CHAT-F-041)
      function formatFileSize(bytes) {
        if (typeof bytes !== "number" || isNaN(bytes) || bytes < 0) return "";
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function clearFileSelection() {
        if (fileInput) {
          fileInput.value = "";
        }
        if (filePreviewBar) {
          filePreviewBar.classList.add("hidden");
        }
        if (filePreviewName) {
          filePreviewName.textContent = "";
        }
        if (filePreviewSize) {
          filePreviewSize.textContent = "";
        }
        if (input) {
          input.setAttribute("required", "");
          input.placeholder = "Type a message...";
        }
      }

      function showFilePreview(file) {
        if (!file || !filePreviewBar) return;
        filePreviewName.textContent = file.name;
        filePreviewSize.textContent = `(${formatFileSize(file.size)})`;
        filePreviewBar.classList.remove("hidden");
        if (input) {
          input.removeAttribute("required");
          input.placeholder = "Add an optional caption...";
        }
      }

      if (attachButton && fileInput) {
        attachButton.addEventListener("click", () => {
          fileInput.click();
        });

        fileInput.addEventListener("change", () => {
          const file = fileInput.files && fileInput.files[0];
          if (!file) {
            clearFileSelection();
            return;
          }

          const allowedExts = [".png", ".jpg", ".jpeg", ".gif", ".webp", ".pdf", ".txt"];
          const lowerName = file.name.toLowerCase();
          const hasValidExt = allowedExts.some((ext) => lowerName.endsWith(ext));
          if (!hasValidExt) {
            notice.textContent = "Unsupported file type. Allowed: PNG, JPEG, GIF, WebP, PDF, TXT.";
            clearFileSelection();
            return;
          }

          if (file.size > 5 * 1024 * 1024) {
            notice.textContent = "File exceeds maximum allowed size (5 MiB).";
            clearFileSelection();
            return;
          }

          notice.textContent = "";
          showFilePreview(file);
        });
      }

      if (fileRemoveButton) {
        fileRemoveButton.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          clearFileSelection();
          input.focus();
        });
      }

      socket.on("connect", () => {
        console.log("Connected to Flask-SocketIO:", socket.id);
        notice.textContent = "";
        if (connectionDot) {
          connectionDot.className = "status-dot";
          connectionDot.parentElement.title = "Connected to chat server";
        }
        flushReadReceipts();

        const activeTarget = recipient.value.trim();
        if (activeTarget && activeTarget.toLowerCase() !== currentUsername.toLowerCase()) {
          requestPresence(activeTarget);
        }
      });

      // Load the user's groups when connected
      socket.emit("load groups");

      // Refresh groups when group membership changes
      socket.on("group created", () => {
          socket.emit("load groups");
      });

      socket.on("group members updated", () => {
          socket.emit("load groups");
      });

      socket.on("group member removed", () => {
          socket.emit("load groups");
      });

      socket.on("group member left", (data) => {
        if (data && Number(data.group_id) === selectedGroupId) {
            selectedGroupId = null;
            messages.innerHTML = "";

            if (emptyState) {
                emptyState.style.display = "block";
            }

            recipient.disabled = false;
        }

        socket.emit("load groups");
    });

    // Handle being removed from a group
    socket.on("group member removed", (data) => {
        if (data && Number(data.group_id) === selectedGroupId) {
            selectedGroupId = null;
            messages.innerHTML = "";

            if (emptyState) {
                emptyState.style.display = "block";
            }

            recipient.disabled = false;
        }

        socket.emit("load groups");
    });

      // Display the groups returned by the server
      socket.on("groups list", (data) => {
        groupList.innerHTML = '<option value="">Select a group</option>';

        if (!data || !Array.isArray(data.groups)) {
            console.error("Invalid groups list:", data);
            return;
        }

        groupDetails.clear();

        data.groups.forEach((group) => {
            groupDetails.set(Number(group.group_id), group);

            const option = document.createElement("option");

            option.value = group.group_id;
            option.textContent = group.name;

            groupList.appendChild(option);
        });

        // Restore the selected group after refreshing the list
        if (selectedGroupId !== null) {
            const selectedOption = [...groupList.options].find(
                option => Number(option.value) === selectedGroupId
            );

            if (selectedOption) {
                groupList.value = String(selectedGroupId);
            } else {
                selectedGroupId = null;
                selectedGroupInfo.style.display = "none";
            }
        }
    });

      // Create a new group
      createGroupButton.addEventListener("click", () => {
          const name = groupNameInput.value.trim();

          const members = groupMembersInput.value
              .split(",")
              .map(username => username.trim())
              .filter(username => username.length > 0);

          if (!name) {
              alert("Please enter a group name.");
              return;
          }

          socket.emit("create group", {
              name: name,
              members: members
          });
      });

      // Add a member to the selected group
      addGroupMemberButton.addEventListener("click", () => {
          if (selectedGroupId === null) {
              notice.textContent = "Please select a group first.";
              return;
          }

          const username = groupMemberUsername.value.trim();

          if (!username) {
              notice.textContent = "Enter a username.";
              return;
          }

          socket.emit("add group member", {
              group_id: selectedGroupId,
              username: username
          });

          groupMemberUsername.value = "";
          notice.textContent = "Add member request sent.";
      });

      // Add Member handler
      addGroupMemberButton.addEventListener("click", () => {
          // existing code...
      });

      // Remove a member from the selected group
      removeGroupMemberButton.addEventListener("click", () => {
          if (selectedGroupId === null) {
              notice.textContent = "Please select a group first.";
              return;
          }

          const username = groupMemberUsername.value.trim();

          if (!username) {
              notice.textContent = "Enter the username to remove.";
              return;
          }

          if (!confirm(`Remove ${username} from this group?`)) {
              return;
          }

          socket.emit("remove group member", {
              group_id: selectedGroupId,
              username: username
          });

          groupMemberUsername.value = "";
          notice.textContent = "Remove member request sent.";
      });


      
      // Leave the selected group
      leaveGroupButton.addEventListener("click", () => {
          if (selectedGroupId === null) {
              notice.textContent = "Please select a group first.";
              return;
          }

          if (!confirm("Are you sure you want to leave this group?")) {
              return;
          }

          socket.emit("leave group", {
              group_id: selectedGroupId
          });
      });


      // Handle group selection
      groupList.addEventListener("change", () => {
          selectedGroupId = groupList.value
              ? Number(groupList.value)
              : null;

              // Display selected group information
              const group = groupDetails.get(selectedGroupId);

              if (group) {
                  selectedGroupInfo.style.display = "block";
                  selectedGroupName.textContent = group.name;
                  selectedGroupAdmin.textContent =
                      "Group Admin: " + group.creator_username;

                  const isAdmin =
                      group.creator_username.toLowerCase() ===
                      currentUsername.toLowerCase();

                  // Only the creator can add or remove members
                  groupMemberUsername.style.display = isAdmin ? "block" : "none";
                  addGroupMemberButton.style.display = isAdmin ? "inline-block" : "none";
                  removeGroupMemberButton.style.display = isAdmin ? "inline-block" : "none";

                  // The creator cannot leave under the current backend rules
                  leaveGroupButton.style.display = isAdmin ? "none" : "inline-block";
              } else {
                  selectedGroupInfo.style.display = "none";
              }

              // Switch between direct chat and group chat
              if (selectedGroupId !== null) {
                  recipient.disabled = true;
                  recipient.value = "";
              } else {
                  recipient.disabled = false;
              }

          messages.innerHTML = "";

          if (selectedGroupId !== null) {
              socket.emit("load group history", {
                  group_id: selectedGroupId
              });
          }
      });

      socket.on("connect_error", (err) => {
        if (connectionDot) {
          connectionDot.className = "status-dot connecting";
          connectionDot.parentElement.title = "Connection error";
        }

        // The server refuses unauthenticated handshakes with the generic
        // reason "unauthorized": send the user back to the login page.
        if (err && err.message === "unauthorized") {
          window.location.href = loginUrl;
          return;
        }

        // Generic message only; no technical details shown to the user.
        notice.textContent =
          "Secure connection failed. Please refresh or log in again.";
      });

      socket.on("disconnect", (reason) => {
        if (connectionDot) {
          connectionDot.className = "status-dot offline";
          connectionDot.parentElement.title = "Disconnected";
        }

        notice.textContent =
          reason === "io server disconnect"
            ? "You were disconnected. Please log in again."
            : "Connection lost. Reconnecting…";
      });

      socket.io.on("reconnect_failed", () => {
        if (connectionDot) {
          connectionDot.className = "status-dot offline";
        }
        notice.textContent =
          "Could not reconnect. Please refresh the page.";
      });

      // Presence broadcast listener (CHAT-F-030)
      socket.on("presence update", (data) => {
        updateRecipientPresence(data);
      });

      // Missed messages on reconnect (CHAT-F-031)
      socket.on("missed messages", (data) => {
        if (!data || typeof data.total !== "number" || data.total <= 0) {
          missedBanner.classList.add("hidden");
          missedText.textContent = "";
          return;
        }

        const senders = data.senders || {};
        const senderParts = [];
        for (const [senderName, count] of Object.entries(senders)) {
          senderParts.push(`${senderName} (${count})`);
        }

        const senderSummary = senderParts.length > 0 ? ` from ${senderParts.join(", ")}` : "";
        const messageWord = data.total === 1 ? "message" : "messages";
        missedText.textContent = `You missed ${data.total} ${messageWord} while offline${senderSummary}.`;
        missedBanner.classList.remove("hidden");
      });

      missedBannerDismiss.addEventListener("click", () => {
        missedBanner.classList.add("hidden");
      });

      // Authoritative unread counts listener (CHAT-F-032)
      socket.on("unread counts", (data) => {
        latestUnreadCounts = {};
        if (data && data.counts && typeof data.counts === "object") {
          for (const [uname, count] of Object.entries(data.counts)) {
            latestUnreadCounts[uname.toLowerCase()] = count;
          }
        }
        updateUnreadBadge();
      });

      function addMessage(message, isOwn) {
        if (!message || (typeof message.text !== "string" && !message.attachment_filename && !message.attachment)) {
          return;
        }

        const messageId =
          message.id != null ? String(message.id) : null;

        // Avoid rendering the same message more than once.
        if (messageId && renderedMessages.has(messageId)) {
          return;
        }

        if (emptyState) {
          emptyState.style.display = "none";
        }

        const item = document.createElement("li");
        item.className = `message-item ${isOwn ? "message-outgoing" : "message-incoming"}`;

        if (messageId) {
          item.dataset.messageId = messageId;
          renderedMessages.add(messageId);
        }

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";

        const header = document.createElement("div");
        header.className = "message-header";

        const senderSpan = document.createElement("span");
        senderSpan.className = "message-sender";
        senderSpan.textContent = isOwn ? "You" : (message.username || "User");
        header.appendChild(senderSpan);
        bubble.appendChild(header);
        if (message.deleted_at) {
          const deletedText = document.createElement("div");
          deletedText.className = "message-text deleted-message";
          deletedText.textContent = "This message was deleted.";
          bubble.appendChild(deletedText);

          item.appendChild(bubble);
          messages.appendChild(item);
          return;
      }

        // Attachment handling (CHAT-F-040)
        const att = message.attachment || (message.attachment_filename ? {
          filename: message.attachment_filename,
          size: message.attachment_size,
          mime: message.attachment_mime,
          url: message.attachment_url || (messageId ? `/attachments/${messageId}` : null)
        } : null);

        if (att && att.filename) {
          const filename = String(att.filename);
          const mime = String(att.mime || "").toLowerCase();
          const isImage = mime.startsWith("image/") || /\.(png|jpe?g|gif|webp)$/i.test(filename);
          const downloadUrl = att.url || (messageId ? `/attachments/${messageId}` : "#");

          if (isImage) {
            const imgContainer = document.createElement("div");
            imgContainer.className = "message-attachment message-attachment-image";

            const imgLink = document.createElement("a");
            imgLink.href = downloadUrl;
            imgLink.target = "_blank";
            imgLink.rel = "noopener noreferrer";
            imgLink.className = "attachment-image-link";
            imgLink.setAttribute("aria-label", `View full image: ${filename}`);

            const img = document.createElement("img");
            img.src = `${downloadUrl}?inline=1`;
            img.alt = filename;
            img.className = "attachment-preview-img";
            img.loading = "lazy";

            imgLink.appendChild(img);
            imgContainer.appendChild(imgLink);
            bubble.appendChild(imgContainer);
          } else {
            const card = document.createElement("div");
            card.className = "message-attachment message-attachment-card";

            const icon = document.createElement("span");
            icon.className = "attachment-icon";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = filename.toLowerCase().endsWith(".pdf") ? "📄" : "📝";
            card.appendChild(icon);

            const info = document.createElement("div");
            info.className = "attachment-info";

            const nameLink = document.createElement("a");
            nameLink.href = downloadUrl;
            nameLink.className = "attachment-filename";
            nameLink.textContent = filename;
            nameLink.download = filename;
            nameLink.target = "_blank";
            nameLink.rel = "noopener noreferrer";
            nameLink.setAttribute("aria-label", `Download ${filename}`);
            info.appendChild(nameLink);

            if (att.size != null) {
              const sizeSpan = document.createElement("span");
              sizeSpan.className = "attachment-size";
              sizeSpan.textContent = formatFileSize(att.size);
              info.appendChild(sizeSpan);
            }
            card.appendChild(info);

            const dlLink = document.createElement("a");
            dlLink.href = downloadUrl;
            dlLink.download = filename;
            dlLink.className = "attachment-download-btn";
            dlLink.textContent = "Download";
            dlLink.setAttribute("aria-label", `Download ${filename}`);
            card.appendChild(dlLink);

            bubble.appendChild(card);
          }
        }

        // Text message / caption rendering
        const textContent = typeof message.text === "string" ? message.text : "";
        const attFilename = att ? String(att.filename || "") : "";
        const hasVisibleCaption = textContent && (!att || textContent.trim() !== attFilename.trim());

        if (hasVisibleCaption) {
          const textDiv = document.createElement("div");
          textDiv.className = "message-text";
          textDiv.textContent = textContent;
          bubble.appendChild(textDiv);
        }

        if (isOwn && messageId) {
          const metaDiv = document.createElement("div");
          metaDiv.className = "message-meta";

          const status = document.createElement("span");
          status.className = "status";
          status.dataset.statusFor = messageId;

          const pendingStatus = pendingStatuses.get(messageId);
          const currentStatus = pendingStatus || message.status || "sent";
          status.dataset.status = currentStatus;
          status.textContent = `(${currentStatus})`;

          metaDiv.appendChild(status);

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "delete-message-btn";
          deleteButton.textContent = "Delete";
          deleteButton.addEventListener("click", () => {
              deleteMessage(messageId);
          });

          metaDiv.appendChild(deleteButton);
          bubble.appendChild(metaDiv);

          ownMessages.set(messageId, status);

          // Apply any status event received before this message.
          if (pendingStatus) {
            pendingStatuses.delete(messageId);
          }
        }

        item.appendChild(bubble);
        messages.appendChild(item);

        if (messagesContainer) {
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        messages.scrollTop = messages.scrollHeight;

        // Incoming messages are queued as unread and only reported
        // as read once the chat window is actually being viewed.
        if (!isOwn && messageId) {
          unreadIncoming.add(messageId);
          flushReadReceipts();
        }
      }

      // Render group chat messages
      function addGroupMessage(message) {
          if (!message || typeof message.text !== "string") {
              return;
          }

          if (emptyState) {
              emptyState.style.display = "none";
          }

          const item = document.createElement("li");

          const senderUsername = message.sender_username || message.username || "";

          const isOwn = senderUsername.toLowerCase() ===
              currentUsername.toLowerCase();

          item.className = `message-item ${
              isOwn ? "message-outgoing" : "message-incoming"
          }`;
          
          if (message.id != null) {
            item.dataset.groupMessageId = String(message.id);
          }

          const bubble = document.createElement("div");
          bubble.className = "message-bubble";

          const header = document.createElement("div");
          header.className = "message-header";

          const sender = document.createElement("span");
          sender.className = "message-sender";
          sender.textContent = isOwn ? "You" : (senderUsername || "User");

          header.appendChild(sender);
          bubble.appendChild(header);

          const textDiv = document.createElement("div");
          textDiv.className = "message-text";

          if (message.deleted_at) {
              textDiv.classList.add("deleted-message");
              textDiv.textContent = "This message was deleted.";
          } else {
              textDiv.textContent = message.text;
          }

          bubble.appendChild(textDiv);

          // Delete button for your own group messages
          if (isOwn && message.id && !message.deleted_at) {
              const deleteButton = document.createElement("button");

              deleteButton.type = "button";
              deleteButton.className = "delete-message-btn";
              deleteButton.textContent = "Delete";

              deleteButton.addEventListener("click", () => {
                  socket.emit("delete group message", {
                      message_id: message.id
                  });
              });

              bubble.appendChild(deleteButton);
          }
          item.appendChild(bubble);
          messages.appendChild(item);

          if (messagesContainer) {
              messagesContainer.scrollTop = messagesContainer.scrollHeight;
          }

          messages.scrollTop = messages.scrollHeight;
      }

      function deleteMessage(messageId) {
        if (!confirm("Are you sure you want to delete this message?")) {
            return;
        }

        socket.emit("delete message", {
            message_id: messageId
        });
      }

     
      form.addEventListener("submit", async (event) => {
          event.preventDefault();

          const text = input.value.trim();
          const to = recipient.value.trim();
          const file = fileInput && fileInput.files && fileInput.files[0];

          // GROUP CHAT
          if (selectedGroupId !== null) {
              if (file) {
                  notice.textContent = "File sharing is not available in group chats yet.";
                  return;
              }

              if (!text) {
                  notice.textContent = "Please enter a message to send.";
                  input.focus();
                  return;
              }

              notice.textContent = "";

              socket.emit("group message", {
                  group_id: selectedGroupId,
                  text: text
              });

              input.value = "";
              input.focus();
              return;
          }

          // DIRECT MESSAGE
          if (!to) {
              notice.textContent = "Please enter a recipient username.";
              recipient.focus();
              return;
          }

          if (to.toLowerCase() === currentUsername.toLowerCase()) {
              notice.textContent = "You cannot send a message to yourself.";
              return;
          }

          // Text message
          if (!file) {
              if (!text) {
                  notice.textContent = "Please enter a message to send.";
                  input.focus();
                  return;
              }

              notice.textContent = "";

              if (sendButton) {
                  sendButton.disabled = true;
                  setTimeout(() => {
                      sendButton.disabled = false;
                  }, 200);
              }

              socket.emit("typing", {
                  recipient: to,
                  is_typing: false
              });

              socket.emit("chat message", {
                  recipient: to,
                  text: text
              });

              input.value = "";
              input.focus();
              return;
          }

          // File upload path via POST /upload
          notice.textContent = "";

          if (sendButton) sendButton.disabled = true;
          if (attachButton) attachButton.disabled = true;

          const originalButtonText = sendButton ? sendButton.textContent : "Send";

          if (sendButton) {
              sendButton.textContent = "Uploading...";
          }

          const formData = new FormData();
          formData.append("recipient", to);
          formData.append("file", file);

          if (text) {
              formData.append("text", text);
          }

          try {
              const res = await fetch("/upload", {
                  method: "POST",
                  body: formData,
                  credentials: "same-origin"
              });

              let data = null;

              try {
                  data = await res.json();
              } catch (_jsonErr) {
                  // JSON parse failed
              }

              if (!res.ok) {
                  const errMsg = (data && data.error)
                      ? data.error
                      : `Upload failed (${res.status}).`;

                  notice.textContent = errMsg;
                  return;
              }

              notice.textContent = "";
              input.value = "";
              clearFileSelection();

              if (data) {
                  addMessage(data, true);
              }

          } catch (_netErr) {
              notice.textContent = "Network error during upload. Please try again.";

          } finally {
              if (sendButton) {
                  sendButton.disabled = false;
                  sendButton.textContent = originalButtonText;
              }

              if (attachButton) {
                  attachButton.disabled = false;
              }

              input.focus();
          }
      });


      recipient.addEventListener("input", () => {
        clearTimeout(presenceDebounce);
        const to = recipient.value.trim();

        if (!to || to.toLowerCase() === currentUsername.toLowerCase()) {
          clearPresenceIndicator();
          updateUnreadBadge();
          return;
        }

        // Clear stale presence indicator when typing a new recipient
        if (activePresenceUsername && activePresenceUsername !== to.toLowerCase()) {
          clearPresenceIndicator();
        }

        updateUnreadBadge();

        presenceDebounce = setTimeout(() => {
          requestPresence(to);
        }, 300);
      });

      recipient.addEventListener("change", () => {
        const to = recipient.value.trim();

        if (to && to.toLowerCase() !== currentUsername.toLowerCase()) {
            requestPresence(to);
            loadChatHistory(to);
        } else {
            messages.innerHTML = "";
            renderedMessages.clear();
            unreadIncoming.clear();

            if (emptyState) {
                emptyState.style.display = "block";
                emptyState.textContent = "Select a conversation to start chatting.";
            }

            clearPresenceIndicator();
          }
      });

      recipient.addEventListener("blur", () => {
        const to = recipient.value.trim();
        if (to && to.toLowerCase() !== currentUsername.toLowerCase()) {
          requestPresence(to);
        }
      });

      input.addEventListener("input", () => {
        const to = recipient.value.trim();

        if (!to) return;

        socket.emit("typing", {
          recipient: to,
          is_typing: input.value.length > 0
        });

        clearTimeout(typingTimer);

        typingTimer = setTimeout(() => {
          socket.emit("typing", {
            recipient: to,
            is_typing: false
          });
        }, 1200);
      });

      input.addEventListener("blur", () => {
        const to = recipient.value.trim();

        if (to) {
          socket.emit("typing", {
            recipient: to,
            is_typing: false
          });
        }
      });

      // Our own outgoing message.
      socket.on("message sent", (message) => {
        addMessage(message, true);
      });

      // Message received from another user.
      socket.on("chat message", (message, acknowledge) => {
        // Acknowledge delivery first. Read is decided separately.
        if (typeof acknowledge === "function") {
          acknowledge({ received: true });
        }

        addMessage(message, false);
      });
      socket.on("chat history", (data) => {
        if (!data || !Array.isArray(data.messages)) return;

        const selectedUser = recipient.value.trim().toLowerCase();

        if (!selectedUser ||
            data.recipient.toLowerCase() !== selectedUser) {
            return;
        }

        messages.innerHTML = "";
        renderedMessages.clear();
        unreadIncoming.clear();
        pendingStatuses.clear();
        ownMessages.clear();

        if (data.messages.length === 0) {
            if (emptyState) {
                emptyState.style.display = "block";
                emptyState.textContent = "No previous messages. Start chatting!";
            }
            return;
        }

        if (emptyState) {
            emptyState.style.display = "none";
        }

        data.messages.forEach((message) => {
            const isOwn = message.username.toLowerCase() === currentUsername.toLowerCase();

            addMessage(message, isOwn);
        });
    });

      // Receive group chat history
      socket.on("group history", (data) => {
          if (!data || Number(data.group_id) !== selectedGroupId) {
              return;
          }

          messages.innerHTML = "";

          if (emptyState) {
              emptyState.style.display =
                  data.messages.length === 0 ? "block" : "none";
          }

          data.messages.forEach((message) => {
              addGroupMessage(message);
          });
      });

      // Receive new group messages
      socket.on("group message", (message) => {
          if (!message || Number(message.group_id) !== selectedGroupId) {
              return;
          }

          addGroupMessage(message);
      });

      // Handle real-time group message deletion
      socket.on("group message deleted", (data) => {
          if (!data || Number(data.group_id) !== selectedGroupId) {
              return;
          }

          const messageElement = messages.querySelector(
              `[data-group-message-id="${data.message_id}"]`
          );

          if (!messageElement) {
              return;
          }

          const textDiv = messageElement.querySelector(".message-text");

          if (textDiv) {
              textDiv.textContent = "This message was deleted.";
              textDiv.classList.add("deleted-message");
          }

          const deleteButton = messageElement.querySelector(".delete-message-btn");

          if (deleteButton) {
              deleteButton.remove();
          }
      });

      socket.on("message deleted", (data) => {
        if (!data || data.message_id == null) return;

        const item = messages.querySelector(
            `[data-message-id="${data.message_id}"]`
        );

        if (!item) return;

        const bubble = item.querySelector(".message-bubble");
        if (!bubble) return;

        bubble.innerHTML = "";

        const deletedText = document.createElement("div");
        deletedText.className = "message-text deleted-message";
        deletedText.textContent = "This message was deleted.";

        bubble.appendChild(deletedText);

        ownMessages.delete(String(data.message_id));
        unreadIncoming.delete(String(data.message_id));
    });

      // Delivery and read receipt updates.
      socket.on("message status", (update) => {
        if (!update || update.message_id == null) {
          return;
        }

        const messageId = String(update.message_id);
        const status = ownMessages.get(messageId);

        console.log("Message status update:", update);

        if (status) {
          status.textContent = `(${update.status})`;
          status.dataset.status = update.status;
        } else {
          // Save the update until its message is rendered.
          pendingStatuses.set(messageId, update.status);
        }
      });

      socket.on("chat error", (error) => {
        const msg = (error && error.message) ? error.message : "Unable to send message.";
        notice.textContent = msg;
        if (msg === "User not found.") {
          clearPresenceIndicator();
        }
      });

      socket.on("typing", (event) => {
        if (event.is_typing) {
          typingIndicator.textContent =
            `${event.username} is typing…`;
        } else {
          typingIndicator.textContent = "";
        }
      });
    </script>
  </body>
</html>
