
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account</title>
</head>
<body>
  <h1>Create an Account</h1>

  {% for category, message in get_flashed_messages(with_categories=true) %}
    <p role="alert">{{ message }}</p>
  {% endfor %}

  <form method="POST" action="{{ url_for('register') }}">
    <label for="username">Username</label><br>
    <input id="username" name="username" minlength="3"
           maxlength="30" required autocomplete="username"><br><br>

    <label for="email">Email</label><br>
    <input id="email" name="email" type="email"
           required autocomplete="email"><br><br>

    <label for="password">Password (at least 12 characters)</label><br>
    <input id="password" name="password" type="password"
           minlength="12" required autocomplete="new-password"><br><br>

    <button type="submit">Register</button>
  </form>

  <p>Already have an account?
    <a href="{{ url_for('login') }}">Log in</a>
  </p>
</body>
</html>
