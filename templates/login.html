<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Real-Time Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="auth-wrapper">
    <div class="auth-card">
      <header class="auth-header">
        <span class="auth-badge">Real-Time Chat</span>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in with your registered username or email to continue.</p>
      </header>

      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ category }}" role="alert">
          <span>{{ message }}</span>
        </div>
      {% endfor %}

      <form method="POST" action="{{ url_for('login') }}" class="auth-form">
        <div class="form-group">
          <label for="username_or_email" class="form-label">Username or Email</label>
          <input
            id="username_or_email"
            name="username_or_email"
            class="form-input"
            required
            autocomplete="username"
            placeholder="e.g. alice or alice@example.com"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-input"
            required
            autocomplete="current-password"
            placeholder="Enter your password"
          >
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <footer class="auth-footer">
        <p>New user? <a href="{{ url_for('register') }}">Create an account</a></p>
      </footer>
    </div>
  </main>
</body>
</html>
