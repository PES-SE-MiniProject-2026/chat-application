
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team 5 - Real-Time Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat-container">
    <h1>Team 5 Chat Application</h1>
    <p>Real-time messaging using Socket.IO</p>

    <input id="username" placeholder="Enter your username" maxlength="30">

    <ul id="messages"></ul>

    <form id="chat-form">
      <input id="message" placeholder="Type a message..." maxlength="1000" required>
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
